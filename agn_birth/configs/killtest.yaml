# AGN birth-model kill test (frozen with PREREGISTRATION.md; do not edit after the final run)
data_dir: data
arxiv_zip: data/raw/arxiv.zip          # if missing, downloaded from snap.stanford.edu
results_dir: results
synthetic: false
splits:
  train: 2017    # past <= 2017, arrivals = 2018 papers (training)
  val: 2018      # past <= 2018, arrivals = 2019 papers (model selection, early stopping)
  test: 2019     # past <= 2019, arrivals = 2020 papers (FINAL, opened once)
min_refs: 2
n_train: 8000
n_val: 6000
n_test: null     # null = all eligible 2020 papers
candidates:
  top_pop: 200
  top_fit: 200
  top_sim: 300
  mem_k: 30
train_negatives: 300
batch_size: 64
max_epochs: 15
patience: 3
grid:
  hidden: [32, 64]
  lr: [0.001, 0.003]
  lr_linear: [0.01, 0.03, 0.1]   # LR-Ranker has 6 weights; needs larger steps
seeds: [0, 1, 2]
K: [20, 50]
bootstrap: 2000
