# SMOKE TEST ONLY: synthetic data. Never used for any conclusion.
dataset: tags-math-sx
raw_dir: data/raw
results_dir: results_smoke
synthetic: true
n_tags: 25
vocab_until: 0.2
cutoffs:
  train: [0.2, 0.3, 0.4, 0.5]   # label window = [cutoff, cutoff + 0.1)
  val: [0.6, 0.7]
  test: [0.8, 0.9]              # FINAL, opened once
window: 0.1
decay_events: 0.1          # recency scale = 10% of all events
groups_per_cutoff: 2000
update_rounds: 2
group_proposal_batches: 3
group_proposal_size: 20000
seeds: [0, 1, 2]
grid:
  hidden: [16]
  lr: [0.003]
  copy_tau: [1.0]
  gbt_depth: [3]
  gbt_lr: [0.1]
max_epochs: 20
patience: 5
