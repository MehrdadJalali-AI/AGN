# AGN-Triad kill test. Frozen with PREREGISTRATION.md; do not edit after `final`.
dataset: tags-math-sx
raw_dir: data/raw
results_dir: results
synthetic: false
n_tags: 80                 # most frequent tags in the first 20% of events
vocab_until: 0.2
cutoffs:
  train: [0.2, 0.3, 0.4, 0.5]   # label window = [cutoff, cutoff + 0.1)
  val: [0.6, 0.7]
  test: [0.8, 0.9]              # FINAL, opened once
window: 0.1
decay_events: 0.1          # recency scale = 10% of all events
groups_per_cutoff: 20000
update_rounds: 2
group_proposal_batches: 10
group_proposal_size: 100000
seeds: [0, 1, 2]
grid:
  hidden: [32, 64]
  lr: [0.001, 0.003]
  copy_tau: [0.5, 1.0, 2.0]
  gbt_depth: [3, 6]
  gbt_lr: [0.05, 0.1]
max_epochs: 300
patience: 25
